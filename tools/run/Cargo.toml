[package]
name = "ssbm-run"
description = "Runs the game headless in the dev runtime and reports progress"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gekko-fp.workspace = true
ssbm-disc.workspace = true
ssbm-ppc.workspace = true
ssbm-rt.workspace = true
ssbm-sdk.workspace = true
ssbm-render.workspace = true
ax-dolphin = { path = "../ax-dolphin", optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
cpal = { version = "0.18", optional = true }
nusb = { version = "0.2", optional = true }
rfd = { version = "0.17", optional = true }
ssbm-slippi.workspace = true
ssbm-game.workspace = true
ssbm-types.workspace = true
zstd = "0.12"

[features]
# AX_CHECK: Dolphin's AX microcode, built from its source, to check ssbm-ax against.
ax-check = ["dep:ax-dolphin"]
# --window: play in a window, with controllers and sound.
window = ["dep:wgpu", "dep:pollster", "dep:winit", "dep:gilrs", "dep:cpal", "dep:nusb"]
# A player's build: starts in a window with no arguments, asking for the disc once, and runs
# as a Windows app without a console.
player = ["window", "dep:rfd"]
